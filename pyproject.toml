[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timing-model"
version = "0.1.0"
description = "Industrial decarbonisation investment-timing model (real options + NPV)"
requires-python = ">=3.11"
dependencies = []  # standard library only - see README

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
timing-model-report = "timing_model.report:main"

[tool.setuptools]
packages = ["timing_model", "data", "analysis", "reporting"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rules the tree is clean against. F and B905 are the ones that have
# actually caught bugs here (a rename that survived the unit suite, a zip that
# would have truncated a comparison silently); the rest keep diffs readable.
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "E501",   # long lines are mostly cited URLs and formatted tables
    "E731",   # short lambdas are the clearest form for SVG scale functions
    "UP031",  # a couple of %-format strings in chart code; rewriting risks more
              # than it gains, and the pages are now covered by test_reporting
    "B007",   # loop variables kept for readability where the tuple shape matters
    "C402", "C408",  # explicit dict()/generator forms that read better in place
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
