[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timing-model"
version = "0.1.0"
description = "Industrial decarbonisation investment-timing model (real options + NPV)"
requires-python = ">=3.11"
dependencies = []  # standard library only - see README

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
timing-model-report = "timing_model.report:main"

[tool.setuptools]
packages = ["timing_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
